<style>
/* ── Reset ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: #e8e7e2;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Screens ─────────────────────────────────────────────── */
.screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.screen.active { display: flex; }

/* ══════════════════════════════════════════════════════════
   SETUP SCREEN
══════════════════════════════════════════════════════════ */
#screen-setup {
  align-items: center;
  overflow-y: auto;
  padding: 24px 16px 40px;
  background: #e8e7e2;
}

.setup-logo  { font-size: 48px; margin-top: 16px; margin-bottom: 4px; }
.setup-title { font-size: 22px; font-weight: 800; color: #111; margin-bottom: 2px; letter-spacing: -0.5px; }
.setup-sub   { font-size: 13px; color: #777; margin-bottom: 28px; }

.card {
  background: #fff;
  border: 1px solid #d4d3cc;
  border-radius: 18px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}

.sec-head {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Role buttons */
.role-grid { display: flex; flex-direction: column; gap: 8px; }
.role-btn {
  background: #f5f5f0;
  border: 2px solid #d4d3cc;
  border-radius: 14px;
  padding: 16px 18px;
  cursor: pointer;
  text-align: left;
  color: #555;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color .12s, background .12s;
}
.role-btn .rb-icon { font-size: 26px; flex-shrink: 0; }
.role-btn .rb-text { display: flex; flex-direction: column; }
.role-btn .rb-name { font-size: 15px; font-weight: 700; color: #222; }
.role-btn .rb-desc { font-size: 12px; color: #888; margin-top: 1px; }
.role-btn:active { opacity: .8; }
.role-btn.sel-coord   { border-color: #6d28d9; background: #f5f3ff; }
.role-btn.sel-fila    { border-color: #1d4ed8; background: #eff6ff; }
.role-btn.sel-atencion { border-color: #15803d; background: #f0fdf4; }

/* Field */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.field input {
  background: #f5f5f0;
  border: 1.5px solid #d4d3cc;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 16px;
  color: #111;
  width: 100%;
}
.field input:focus { outline: none; border-color: #999; background: #fff; }

/* Session list */
.session-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
.session-item {
  background: #f5f5f0;
  border: 2px solid #d4d3cc;
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color .1s;
}
.session-item:active { background: #ebebeb; }
.session-item.selected { border-color: #15803d; background: #f0fdf4; }
.si-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.si-dot.waiting { background: #d97706; }
.si-dot.active  { background: #16a34a; box-shadow: 0 0 0 3px #bbf7d0; }
.si-dot.ended   { background: #aaa; }
.si-info { flex: 1; min-width: 0; }
.si-label { font-size: 15px; font-weight: 700; color: #111; }
.si-meta  { font-size: 12px; color: #888; margin-top: 1px; }
.si-status { font-size: 12px; font-weight: 700; }
.si-status.waiting { color: #b45309; }
.si-status.active  { color: #15803d; }
.si-status.ended   { color: #999; }

.empty-msg { text-align: center; padding: 20px; color: #aaa; font-size: 14px; }

.btn-refresh {
  background: none;
  border: none;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.btn-refresh:active { color: #555; }

/* Enter button */
.btn-enter {
  background: #111;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  border: none;
  border-radius: 14px;
  padding: 16px;
  cursor: pointer;
  width: 100%;
  letter-spacing: .01em;
}
.btn-enter:active   { opacity: .85; }
.btn-enter:disabled { opacity: .25; pointer-events: none; }

/* ══════════════════════════════════════════════════════════
   SHARED TOPBAR
══════════════════════════════════════════════════════════ */
.topbar {
  background: #fff;
  border-bottom: 1.5px solid #d4d3cc;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.topbar-left { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.topbar-role    { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #888; font-weight: 600; }
.topbar-session { font-size: 14px; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right   { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

.badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; white-space: nowrap; }
.badge-online  { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
.badge-offline { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }
.badge-queue   { background: #eff6ff; color: #1d4ed8; border: 1px solid #93c5fd; }
.badge-waiting { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
.badge-active  { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
.badge-ended   { background: #f5f5f0; color: #999;    border: 1px solid #ddd; }

.btn-icon {
  background: #f5f5f0;
  border: 1.5px solid #d4d3cc;
  border-radius: 8px;
  color: #666;
  font-size: 14px;
  padding: 6px 10px;
  cursor: pointer;
  font-weight: 600;
}
.btn-icon:active { background: #ebebeb; }

/* ══════════════════════════════════════════════════════════
   COORDINATOR SCREEN
══════════════════════════════════════════════════════════ */
#screen-coordinator { background: #e8e7e2; }

.coord-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
  gap: 20px;
  overflow-y: auto;
}
.coord-state-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #999;
  font-weight: 700;
}
.coord-timer {
  font-size: 60px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  color: #111;
  line-height: 1;
}

/* Big coordinator action buttons */
.btn-action {
  width: 100%;
  max-width: 320px;
  padding: 28px 20px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  transition: transform .08s, filter .1s;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.btn-action:active  { transform: scale(.97); filter: brightness(.95); }
.btn-action:disabled { opacity: .3; pointer-events: none; }
.btn-action .a-icon  { font-size: 40px; line-height: 1; }
.btn-action .a-label { font-size: 18px; letter-spacing: .02em; }
.btn-action .a-hint  { font-size: 13px; opacity: .75; font-weight: 500; }
.btn-action.start { background: #16a34a; color: #fff; }
.btn-action.stop  { background: #dc2626; color: #fff; }

/* Live stats */
.live-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 320px;
}
.stat-box {
  background: #fff;
  border: 1.5px solid #d4d3cc;
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.stat-box .sb-n { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; color: #111; }
.stat-box .sb-l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-top: 5px; font-weight: 600; }

.ended-wrap { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 320px; }
.ended-icon  { font-size: 56px; }
.ended-title { font-size: 20px; font-weight: 800; color: #111; }
.ended-sub   { font-size: 14px; color: #888; }

.btn-secondary {
  background: #fff;
  border: 1.5px solid #d4d3cc;
  color: #333;
  font-size: 15px;
  font-weight: 700;
  border-radius: 14px;
  padding: 14px;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.btn-secondary:active { background: #f5f5f0; }
.btn-secondary.primary { background: #111; color: #fff; border-color: #111; }
.btn-secondary.primary:active { background: #333; }

/* ══════════════════════════════════════════════════════════
   OBSERVER MAIN SCREEN
══════════════════════════════════════════════════════════ */
#screen-main { background: #e8e7e2; }

.tabs {
  display: flex;
  background: #fff;
  border-bottom: 1.5px solid #d4d3cc;
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 13px 4px;
  font-size: 13px;
  font-weight: 600;
  color: #aaa;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
}
.tab.active { color: #111; border-bottom-color: #111; }

/* Tab: Registrar */
#tab-registrar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
  gap: 16px;
  overflow-y: auto;
}

.timer-wrap   { text-align: center; }
.timer-label  { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #aaa; margin-bottom: 4px; font-weight: 600; }
.timer-display {
  font-size: 52px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  line-height: 1;
  color: #ccc;
  transition: color .3s;
}
.timer-display.running { color: #111; }

/* State messages */
.state-msg {
  text-align: center;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  display: none;
  width: 100%;
  max-width: 340px;
}
.state-msg.show    { display: block; }
.state-msg.waiting { background: #fffbeb; border: 1.5px solid #fcd34d; color: #92400e; }
.state-msg.ended   { background: #f5f5f0; border: 1.5px solid #ddd;    color: #888; }

/* Action buttons for observers */
.action-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }

.btn-obs {
  width: 100%;
  padding: 26px 20px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 16px;
  font-weight: 800;
  transition: transform .07s, filter .08s;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
  text-align: left;
}
.btn-obs:active   { transform: scale(.97); filter: brightness(.92); }
.btn-obs:disabled { opacity: .2; pointer-events: none; }
.btn-obs .bo-icon  { font-size: 36px; flex-shrink: 0; }
.btn-obs .bo-text  { display: flex; flex-direction: column; }
.btn-obs .bo-label { font-size: 18px; letter-spacing: .01em; }
.btn-obs .bo-hint  { font-size: 12px; font-weight: 500; opacity: .75; margin-top: 2px; }

.btn-llegada { background: #1d4ed8; color: #fff; }
.btn-inicio  { background: #16a34a; color: #fff; }
.btn-fin     { background: #dc2626; color: #fff; }

/* Last registered display */
.last-wrap { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
.last-item {
  background: #fff;
  border: 1.5px solid #d4d3cc;
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.last-item .li-label { font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.last-item .li-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: #111; }
.last-item .li-hint  { font-size: 11px; color: #bbb; margin-top: 1px; }

/* Ripple */
@keyframes ripple { 0% { transform: scale(0); opacity: .4; } 100% { transform: scale(6); opacity: 0; } }
.ripple { position: absolute; border-radius: 50%; width: 60px; height: 60px; background: rgba(255,255,255,.4); animation: ripple .5s ease-out forwards; pointer-events: none; }

/* Tab: Datos */
#tab-datos { flex: 1; overflow-y: auto; padding: 12px 14px; display: none; background: #e8e7e2; }

.data-section  { margin-bottom: 18px; }
.data-header   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.data-title    { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: #555; }
.data-count    { font-size: 11px; color: #888; background: #fff; padding: 3px 10px; border-radius: 20px; border: 1px solid #d4d3cc; font-weight: 600; }
.event-list    { display: flex; flex-direction: column; gap: 4px; }
.event-item    { background: #fff; border: 1px solid #d4d3cc; border-radius: 10px; display: flex; align-items: center; padding: 9px 12px; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.ei-n    { font-size: 11px; color: #ccc; min-width: 22px; font-weight: 600; }
.ei-hora { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; color: #111; }
.ei-intv { font-size: 12px; color: #888; font-variant-numeric: tabular-nums; }
.ei-src  { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
.src-online  { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
.src-offline { background: #eff6ff; color: #1d4ed8; border: 1px solid #93c5fd; }

.color-llegada { color: #1d4ed8; }
.color-inicio  { color: #15803d; }
.color-fin     { color: #dc2626; }
.empty-list    { text-align: center; padding: 24px; color: #bbb; font-size: 14px; }

/* Mode toggle (Nueva / Retomar) */
.mode-toggle { display: flex; background: #ebebeb; border-radius: 10px; padding: 3px; gap: 2px; }
.mode-tab { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; background: none; color: #aaa; transition: background .12s, color .12s; }
.mode-tab.active { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

/* Spinner */
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #d4d3cc; border-top-color: #666; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sync state badges */
.badge-saving    { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
.badge-desynced  { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }

/* Event counter + undo */
.event-counter {
  width: 100%; max-width: 340px;
  font-size: 12px; color: #555; text-align: center;
  padding: 8px 12px;
  background: #fff; border: 1px solid #d4d3cc; border-radius: 10px;
  font-variant-numeric: tabular-nums;
}
.btn-undo {
  width: 100%; max-width: 340px;
  padding: 12px; border-radius: 12px;
  border: 1.5px solid #d4d3cc; background: #fff;
  color: #333; font-size: 14px; font-weight: 700; cursor: pointer;
}
.btn-undo:disabled { opacity: .3; pointer-events: none; }
.btn-undo:active   { background: #f5f5f0; }
</style>
</head>

    <div class="topbar-right">
      <span class="badge" id="badge-status" style="display:none">—</span>
      <span class="badge" id="badge-sync" style="display:none">✓ Sync</span>
      <span class="badge badge-online" id="badge-conn">● Online</span>
      <span class="badge badge-queue"  id="badge-queue" style="display:none">↑ 0</span>
      <button class="btn-icon" onclick="syncManual()" title="Forzar sincronización">↺</button>
      <button class="btn-icon" onclick="forceRefresh()" title="Forzar refresh">⟳</button>
      <button class="btn-icon" onclick="volverSetup()" title="Salir">✕</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('registrar', this)">Registrar</button>
    <button class="tab"        onclick="showTab('datos',     this)">Datos</button>
  </div>

  <!-- Tab: Registrar -->
  <div id="tab-registrar">
    <div class="timer-wrap">
      <div class="timer-label">Tiempo en sesión</div>
      <div class="timer-display" id="timer-display">00:00</div>
    </div>

    <div class="state-msg waiting" id="msg-waiting">⏳ Esperando que el coordinador inicie la sesión…</div>
    <div class="state-msg ended"   id="msg-ended">🏁 Sesión finalizada.</div>

    <!-- Botones de acción (renderizados según rol) -->
    <div class="action-buttons" id="action-buttons"></div>

    <!-- Último registro -->
    <div class="last-wrap" id="last-wrap"></div>
  </div>

  <!-- Tab: Datos -->
  <div id="tab-datos">
    <div id="datos-content"></div>
  </div>
</div>

<script type="module">
import {
  createSession, updateSession, fetchSessions,
  insertEvento, fetchSession, fetchOneSession, subscribeTable,
  syncNow, qCount, serverNow, deleteEvento, removeFromQueue
} from './supabase.js';

// ══════════════════════════════════════════════════════════════
//  Estado
// ══════════════════════════════════════════════════════════════
let rol           = null;   // fila | atencion | coordinador
let sessionId     = null;
let sessionLabel  = null;
let nCajas        = 3;
let sessionStatus = null;   // waiting | active | ended
let sessionEvents = [];
let timerIv       = null;
let coordTimerIv  = null;
let unsubSession  = null;
let unsubEventos  = null;
let online        = navigator.onLine;
let selectedSession      = null;
let selectedCoordSession = null;
let coordMode            = 'nueva';   // nueva | retomar
let visibilityHandler    = null;
let sessionStartedAt     = null;   // ms timestamp — real session start
let syncState            = 'synced'; // offline | saving | synced | desynced

// Último registro por tipo (para display)
const lastReg = { llegada: null, inicio: null, fin: null };

// ══════════════════════════════════════════════════════════════
//  Setup
// ══════════════════════════════════════════════════════════════
window.pickRole = function(btn) {
  document.querySelectorAll('.role-btn').forEach(b =>
    b.classList.remove('sel-coord','sel-fila','sel-atencion')
  );
  rol = btn.dataset.role;
  const cls = { coordinador:'sel-coord', fila:'sel-fila', atencion:'sel-atencion' }[rol];
  btn.classList.add(cls);

  document.getElementById('coord-form').style.display = rol === 'coordinador' ? 'flex' : 'none';
  document.getElementById('obs-form').style.display   = rol !== 'coordinador' ? 'flex'  : 'none';
  selectedSession = null;

  if (rol !== 'coordinador') recargarSesiones();
  validarSetup();
};

window.recargarSesiones = async function() {
  const list = document.getElementById('session-list');
  list.innerHTML = '<div class="empty-msg">Cargando…</div>';
  selectedSession = null;
  validarSetup();
  try {
    const all = await fetchSessions();
    const visible = all.filter(s => s.status !== 'ended');
    if (!visible.length) {
      list.innerHTML = '<div class="empty-msg">Sin sesiones disponibles.<br>El coordinador debe crear una.</div>';
      return;
    }
    list.innerHTML = visible.map(s => `
      <div class="session-item" data-id="${s.id}" onclick='selectSession(this, ${JSON.stringify(s)})'>
        <div class="si-dot ${s.status}"></div>
        <div class="si-info">
          <div class="si-label">${s.label}</div>
          <div class="si-meta">${s.n_cajas} caja${s.n_cajas>1?'s':''}</div>
        </div>
        <div class="si-status ${s.status}">${s.status==='waiting'?'Esperando':'Activa'}</div>
      </div>`).join('');
  } catch {
    list.innerHTML = '<div class="empty-msg">Error de conexión. Intenta de nuevo.</div>';
  }
};

window.selectSession = function(el, s) {
  document.querySelectorAll('.session-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  selectedSession = s;
  validarSetup();
};

function validarSetup() {
  let ok;
  if (rol === 'coordinador') {
    ok = coordMode === 'nueva'
      ? !!(document.getElementById('inp-label')?.value?.trim())
      : !!selectedCoordSession;
  } else {
    ok = !!(rol && selectedSession);
  }
  document.getElementById('btn-entrar').disabled = !ok;
}

document.getElementById('inp-label').addEventListener('input', validarSetup);

window.switchCoordMode = function(mode) {
  coordMode = mode;
  document.getElementById('tab-nueva').classList.toggle('active', mode === 'nueva');
  document.getElementById('tab-retomar').classList.toggle('active', mode === 'retomar');
  document.getElementById('coord-nueva').style.display   = mode === 'nueva'   ? 'flex' : 'none';
  document.getElementById('coord-retomar').style.display = mode === 'retomar' ? 'flex' : 'none';
  if (mode === 'retomar') recargarSesionesCoord();
  validarSetup();
};

window.recargarSesionesCoord = async function() {
  const list = document.getElementById('coord-session-list');
  list.innerHTML = '<div class="empty-msg">Cargando…</div>';
  selectedCoordSession = null;
  validarSetup();
  try {
    const all = await fetchSessions();
    const visible = all.filter(s => s.status !== 'ended');
    if (!visible.length) {
      list.innerHTML = '<div class="empty-msg">Sin sesiones activas para retomar.</div>';
      return;
    }
    list.innerHTML = visible.map(s => `
      <div class="session-item" data-id="${s.id}" onclick='selectCoordSession(this, ${JSON.stringify(s)})'>
        <div class="si-dot ${s.status}"></div>
        <div class="si-info">
          <div class="si-label">${s.label}</div>
          <div class="si-meta">${s.n_cajas} caja${s.n_cajas>1?'s':''}</div>
        </div>
        <div class="si-status ${s.status}">${s.status==='waiting'?'Esperando':'Activa'}</div>
      </div>`).join('');
  } catch {
    list.innerHTML = '<div class="empty-msg">Error de conexión.</div>';
  }
};

window.selectCoordSession = function(el, s) {
  document.querySelectorAll('#coord-session-list .session-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  selectedCoordSession = s;
  validarSetup();
};

// ══════════════════════════════════════════════════════════════
//  Entrar
// ══════════════════════════════════════════════════════════════
window.entrar = async function() {
  document.getElementById('btn-entrar').disabled = true;
  if (rol === 'coordinador') {
    coordMode === 'retomar' ? await entrarCoordinadorRetomar() : await entrarCoordinador();
  } else {
    await entrarObservador();
  }
};

async function entrarCoordinador() {
  const label = document.getElementById('inp-label').value.trim();
  const cajas = parseInt(document.getElementById('inp-cajas').value) || 3;
  sessionId    = 'ses_' + Date.now();
  sessionLabel = label;
  nCajas       = cajas;

  try {
    await createSession({ id: sessionId, label, n_cajas: cajas, status: 'waiting' });
    sessionStatus = 'waiting';
  } catch {
    alert('Error al crear sesión. Verifica la conexión.');
    document.getElementById('btn-entrar').disabled = false;
    return;
  }

  document.getElementById('coord-lbl-session').textContent = label;
  showScreen('coordinator');
  renderCoordBadge();
  renderCoordBody();
  document.getElementById('coord-badge-sync').style.display = 'inline-block';
  setSyncState(online ? 'synced' : 'offline');

  unsubSession = subscribeTable('sessions', `id=eq.${sessionId}`, (ev, row) => {
    if (row.status !== sessionStatus) {
      if (row.started_at != null) sessionStartedAt = Number(row.started_at);
      sessionStatus = row.status;
      renderCoordBadge();
      renderCoordBody();
    }
  });
  unsubEventos = subscribeTable('eventos', `session_id=eq.${sessionId}`, (ev, row) => {
    if (ev === 'INSERT') {
      const rowTs = Number(row.t_server);
      const exists = sessionEvents.some(e =>
        (e.id != null && e.id === row.id) ||
        (Number(e.t_server) === rowTs && e.tipo === row.tipo)
      );
      if (!exists) {
        sessionEvents.push({ ...row, t_server: rowTs });
        updateCoordStats();
      }
    }
  });

  window.addEventListener('online',  onOnline);
  window.addEventListener('offline', onOffline);
  updateCoordConnBadge();
  registerVisibilityHandler();
}

async function entrarCoordinadorRetomar() {
  const s      = selectedCoordSession;
  sessionId    = s.id;
  sessionLabel = s.label;
  nCajas       = s.n_cajas;
  sessionStatus = s.status;
  sessionStartedAt = s.started_at != null ? Number(s.started_at) : null;

  document.getElementById('coord-lbl-session').textContent = sessionLabel;
  showScreen('coordinator');
  renderCoordBadge();
  renderCoordBody();
  document.getElementById('coord-badge-sync').style.display = 'inline-block';
  setSyncState(online ? 'synced' : 'offline');

  // Load existing events for stats
  try {
    const raw = (await fetchSession(sessionId)) || [];
    sessionEvents = raw.map(e => ({ ...e, t_server: Number(e.t_server) }));
    updateCoordStats();
  } catch { sessionEvents = []; }

  unsubSession = subscribeTable('sessions', `id=eq.${sessionId}`, (ev, row) => {
    if (row.status !== sessionStatus) {
      if (row.started_at != null) sessionStartedAt = Number(row.started_at);
      sessionStatus = row.status;
      renderCoordBadge();
      renderCoordBody();
    }
  });
  unsubEventos = subscribeTable('eventos', `session_id=eq.${sessionId}`, (ev, row) => {
    if (ev === 'INSERT') {
      const rowTs = Number(row.t_server);
      const exists = sessionEvents.some(e =>
        (e.id != null && e.id === row.id) ||
        (Number(e.t_server) === rowTs && e.tipo === row.tipo)
      );
      if (!exists) {
        sessionEvents.push({ ...row, t_server: rowTs });
        updateCoordStats();
      }
    }
  });

  window.addEventListener('online',  onOnline);
  window.addEventListener('offline', onOffline);
  updateCoordConnBadge();
  registerVisibilityHandler();
}

async function entrarObservador() {
  const s      = selectedSession;
  sessionId    = s.id;
  sessionLabel = s.label;
  nCajas       = s.n_cajas;
  sessionStatus = s.status;
  sessionStartedAt = s.started_at != null ? Number(s.started_at) : null;

  const rolLabel = rol === 'fila' ? 'Observador de Fila' : 'Observador de Atención';
  const rolColor = rol === 'fila' ? '#1d4ed8' : '#15803d';
  document.getElementById('lbl-rol').textContent    = rolLabel;
  document.getElementById('lbl-rol').style.color    = rolColor;
  document.getElementById('lbl-sesion').textContent = sessionLabel;

  showScreen('main');
  renderActionButtons();
  applySessionState(sessionStatus);
  await cargarSesion();
  document.getElementById('badge-sync').style.display = 'inline-block';
  setSyncState(online ? 'synced' : 'offline');

  unsubSession = subscribeTable('sessions', `id=eq.${sessionId}`, (ev, row) => {
    if (row.status !== sessionStatus) {
      if (row.started_at != null) sessionStartedAt = Number(row.started_at);
      sessionStatus = row.status;
      applySessionState(sessionStatus);
    }
  });
  unsubEventos = subscribeTable('eventos', `session_id=eq.${sessionId}`, (ev, row) => {
    if (ev === 'INSERT') {
      const rowTs = Number(row.t_server);
      const exists = sessionEvents.some(e =>
        (e.id != null && e.id === row.id) ||
        (Number(e.t_server) === rowTs && e.tipo === row.tipo)
      );
      if (!exists) {
        sessionEvents.push({ ...row, t_server: rowTs });
        renderDatos();
        updateEventCounter();
      }
    }
  });

  window.addEventListener('online',  onOnline);
  window.addEventListener('offline', onOffline);
  updateConnBadge();
  registerVisibilityHandler();
}

// ══════════════════════════════════════════════════════════════
//  Render action buttons (por rol)
// ══════════════════════════════════════════════════════════════
function renderActionButtons() {
  const wrap = document.getElementById('action-buttons');
  const lastW = document.getElementById('last-wrap');

  if (rol === 'fila') {
    wrap.innerHTML = `
      <button class="btn-obs btn-llegada" id="btn-llegada" onclick="registrarTipo('llegada', event)" disabled>
        <span class="bo-icon">⬇</span>
        <div class="bo-text">
          <span class="bo-label">LLEGÓ ALGUIEN</span>
          <span class="bo-hint">Toca cada vez que llegue un cliente</span>
        </div>
      </button>
      <div class="event-counter" id="event-counter">Llegadas: 0</div>
      <button class="btn-undo" id="btn-undo" onclick="deshacerUltimo()" disabled>↩ Deshacer último</button>`;
    lastW.innerHTML = `
      <div class="last-item">
        <div><div class="li-label">Último registro</div><div class="li-hint" id="lh-llegada">—</div></div>
        <div class="li-value" id="lv-llegada">—</div>
      </div>`;
  } else {
    wrap.innerHTML = `
      <button class="btn-obs btn-inicio" id="btn-inicio" onclick="registrarTipo('inicio', event)" disabled>
        <span class="bo-icon">▶</span>
        <div class="bo-text">
          <span class="bo-label">INICIO ATENCIÓN</span>
          <span class="bo-hint">Toca cuando empieza a ser atendido</span>
        </div>
      </button>
      <button class="btn-obs btn-fin" id="btn-fin" onclick="registrarTipo('fin', event)" disabled>
        <span class="bo-icon">■</span>
        <div class="bo-text">
          <span class="bo-label">FIN ATENCIÓN</span>
          <span class="bo-hint">Toca cuando termina y se va</span>
        </div>
      </button>
      <div class="event-counter" id="event-counter">Inicio: 0 · Fin: 0</div>
      <button class="btn-undo" id="btn-undo" onclick="deshacerUltimo()" disabled>↩ Deshacer último</button>`;
    lastW.innerHTML = `
      <div class="last-item">
        <div><div class="li-label" style="color:#15803d">Último inicio</div><div class="li-hint" id="lh-inicio">—</div></div>
        <div class="li-value" id="lv-inicio">—</div>
      </div>
      <div class="last-item">
        <div><div class="li-label" style="color:#dc2626">Último fin</div><div class="li-hint" id="lh-fin">—</div></div>
        <div class="li-value" id="lv-fin">—</div>
      </div>`;
  }
}

// ══════════════════════════════════════════════════════════════
//  Session state → observer UI
// ══════════════════════════════════════════════════════════════
function applySessionState(status) {
  document.getElementById('msg-waiting').classList.remove('show');
  document.getElementById('msg-ended').classList.remove('show');

  const badge = document.getElementById('badge-status');
  badge.style.display = 'inline-block';

  const buttons = document.querySelectorAll('.btn-obs');

  if (status === 'active') {
    buttons.forEach(b => b.disabled = false);
    badge.className   = 'badge badge-active';
    badge.textContent = '● Activa';
    startTimer();
  } else if (status === 'waiting') {
    buttons.forEach(b => b.disabled = true);
    document.getElementById('msg-waiting').classList.add('show');
    badge.className   = 'badge badge-waiting';
    badge.textContent = '⏳ Esperando';
  } else {
    buttons.forEach(b => b.disabled = true);
    document.getElementById('msg-ended').classList.add('show');
    badge.className   = 'badge badge-ended';
    badge.textContent = '■ Finalizada';
    stopTimer();
  }
}

// ══════════════════════════════════════════════════════════════
//  Visibility handler — re-validates session on tab/app return
// ══════════════════════════════════════════════════════════════
function registerVisibilityHandler() {
  if (visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler);
  visibilityHandler = async function() {
    if (document.hidden || !sessionId) return;
    try {
      const s = await fetchOneSession(sessionId);
      if (!s) return;
      if (s.status !== sessionStatus) {
        sessionStatus = s.status;
        if (rol === 'coordinador') {
          renderCoordBadge();
          renderCoordBody();
        } else {
          applySessionState(sessionStatus);
        }
      }
    } catch {}
  };
  document.addEventListener('visibilitychange', visibilityHandler);
}

// ══════════════════════════════════════════════════════════════
//  Registrar evento (genérico, tipo explícito)
// ══════════════════════════════════════════════════════════════
window.registrarTipo = async function(tipo, e) {
  if (sessionStatus !== 'active') return;
  const btn = e.currentTarget;
  btn.disabled = true;

  // Ripple
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  r.style.left = (e.clientX - rect.left - 30) + 'px';
  r.style.top  = (e.clientY - rect.top  - 30) + 'px';
  btn.appendChild(r);
  setTimeout(() => r.remove(), 600);

  const t_server = await serverNow();
  const hora     = new Date(t_server).toLocaleTimeString('es-CL', { hour12: false });
  const row      = { session_id: sessionId, session_label: sessionLabel, tipo, t_server, hora };

  setSyncState('saving');
  const { ok, offline, flushed } = await insertEvento(row);

  // If queued events were flushed, reload from DB to replace _offline entries
  // with server rows (correct id, normalized t_server, no duplicates)
  if (ok && flushed > 0) await cargarSesion();

  if (ok) {
    if (offline) { sessionEvents.push({ ...row, _offline: true }); renderDatos(); }

    // Update last display
    const prev = lastReg[tipo];
    if (prev) {
      const diff = ((t_server - prev.t_server) / 1000).toFixed(1);
      setLastDisplay(tipo, hora, `${diff}s desde anterior`);
    } else {
      setLastDisplay(tipo, hora, 'primer registro');
    }
    lastReg[tipo] = { t_server };

    if (navigator.vibrate) navigator.vibrate(offline ? [30, 30, 30] : 30);
  }

  setSyncState(qCount() > 0 ? 'desynced' : online ? 'synced' : 'offline');
  updateQueueBadge();
  updateEventCounter();
  setTimeout(() => { if (sessionStatus === 'active') btn.disabled = false; }, 350);
};

function setLastDisplay(tipo, hora, hint) {
  const v = document.getElementById('lv-' + tipo);
  const h = document.getElementById('lh-' + tipo);
  if (v) v.textContent = hora;
  if (h) h.textContent = hint;
}

// ══════════════════════════════════════════════════════════════
//  Coordinator render
// ══════════════════════════════════════════════════════════════
function renderCoordBadge() {
  const badge = document.getElementById('coord-badge-status');
  const map = {
    waiting: ['badge badge-waiting', '⏳ Esperando'],
    active:  ['badge badge-active',  '● Activa'],
    ended:   ['badge badge-ended',   '■ Finalizada'],
  };
  const [cls, text] = map[sessionStatus] || ['badge', '—'];
  badge.className   = cls;
  badge.textContent = text;
}

function renderCoordBody() {
  const body = document.getElementById('coord-body');
  clearInterval(coordTimerIv);

  if (sessionStatus === 'waiting') {
    body.innerHTML = `
      <div class="coord-state-label">Sesión lista · Esperando observadores</div>
      <button class="btn-action start" onclick="iniciarSesion()">
        <span class="a-icon">▶</span>
        <span class="a-label">INICIAR SESIÓN</span>
        <span class="a-hint">Habilita el registro para todos</span>
      </button>`;

  } else if (sessionStatus === 'active') {
    body.innerHTML = `
      <div class="coord-timer" id="coord-timer">00:00</div>
      <div class="live-stats">
        <div class="stat-box">
          <div class="sb-n color-llegada" id="cs-llegada">0</div>
          <div class="sb-l">Llegadas</div>
        </div>
        <div class="stat-box">
          <div class="sb-n color-inicio" id="cs-inicio">0</div>
          <div class="sb-l">Inicio</div>
        </div>
        <div class="stat-box">
          <div class="sb-n color-fin" id="cs-fin">0</div>
          <div class="sb-l">Fin</div>
        </div>
        <div class="stat-box">
          <div class="sb-n" id="cs-total" style="color:#111">0</div>
          <div class="sb-l">Total</div>
        </div>
      </div>
      <button class="btn-action stop" onclick="terminarSesion()">
        <span class="a-icon">■</span>
        <span class="a-label">TERMINAR SESIÓN</span>
        <span class="a-hint">Bloquea el registro</span>
      </button>`;
    updateCoordStats();
    startCoordTimer();

  } else {
    body.innerHTML = `
      <div class="ended-wrap">
        <div class="ended-icon">🏁</div>
        <div class="ended-title">Sesión finalizada</div>
        <div class="ended-sub">${sessionLabel} · ${sessionEvents.length} registros</div>
        <button class="btn-secondary primary" onclick="volverSetup()">Nueva sesión</button>
      </div>`;
  }
}

function updateCoordStats() {
  ['llegada','inicio','fin'].forEach(t => {
    const el = document.getElementById('cs-' + t);
    if (el) el.textContent = sessionEvents.filter(e => e.tipo === t).length;
  });
  const tot = document.getElementById('cs-total');
  if (tot) tot.textContent = sessionEvents.length;
}

function startCoordTimer() {
  const ref = sessionStartedAt || Date.now();
  coordTimerIv = setInterval(() => {
    const el = document.getElementById('coord-timer');
    if (!el) { clearInterval(coordTimerIv); return; }
    const s  = Math.floor((Date.now() - ref) / 1000);
    el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }, 500);
}

// ══════════════════════════════════════════════════════════════
//  Coordinator actions
// ══════════════════════════════════════════════════════════════
window.iniciarSesion = async function() {
  const started_at = await serverNow();
  await updateSession(sessionId, { status: 'active', started_at });
  sessionStartedAt = started_at;
  sessionStatus = 'active';
  renderCoordBadge();
  renderCoordBody();
};

window.terminarSesion = async function() {
  const ended_at = await serverNow();
  await updateSession(sessionId, { status: 'ended', ended_at });
  clearInterval(coordTimerIv);
  sessionStatus = 'ended';
  renderCoordBadge();
  renderCoordBody();
};

// ══════════════════════════════════════════════════════════════
//  Load events
// ══════════════════════════════════════════════════════════════
async function cargarSesion() {
  try {
    const raw = (await fetchSession(sessionId)) || [];
    // Normalize t_server to Number — DB returns bigint as number in JSON,
    // but normalize defensively in case of string coercion from some paths
    sessionEvents = raw.map(e => ({ ...e, t_server: Number(e.t_server) }));
    // Init lastReg from loaded data
    ['llegada','inicio','fin'].forEach(tipo => {
      const evs = sessionEvents.filter(e => e.tipo === tipo).sort((a,b) => a.t_server - b.t_server);
      if (evs.length) {
        const last = evs.at(-1);
        lastReg[tipo] = { t_server: last.t_server };
        const prev = evs.length > 1 ? evs.at(-2) : null;
        const diff = prev ? ((last.t_server - prev.t_server)/1000).toFixed(1) + 's desde anterior' : 'primer registro';
        setLastDisplay(tipo, last.hora, diff);
      }
    });
    renderDatos();
    updateEventCounter();
  } catch { /* offline */ }
}

// ══════════════════════════════════════════════════════════════
//  Timer
// ══════════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  const ref = sessionStartedAt || Date.now();
  const display = document.getElementById('timer-display');
  timerIv = setInterval(() => {
    const s = Math.floor((Date.now() - ref) / 1000);
    display.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    display.classList.toggle('running', s > 0);
  }, 500);
}
function stopTimer() { clearInterval(timerIv); }

// ══════════════════════════════════════════════════════════════
//  Navigation
// ══════════════════════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const id = { setup:'screen-setup', coordinator:'screen-coordinator', main:'screen-main' }[name];
  document.getElementById(id).classList.add('active');
}

window.volverSetup = function() {
  if (unsubSession) { unsubSession(); unsubSession = null; }
  if (unsubEventos) { unsubEventos(); unsubEventos = null; }
  stopTimer();
  clearInterval(coordTimerIv);
  window.removeEventListener('online', onOnline);
  window.removeEventListener('offline', onOffline);
  if (visibilityHandler) {
    document.removeEventListener('visibilitychange', visibilityHandler);
    visibilityHandler = null;
  }
  sessionEvents        = [];
  rol                  = null;
  selectedSession      = null;
  sessionStatus        = null;
  sessionStartedAt     = null;
  syncState            = 'synced';
  coordMode            = 'nueva';
  selectedCoordSession = null;
  const bs = document.getElementById('badge-sync');
  const cs = document.getElementById('coord-badge-sync');
  if (bs) bs.style.display = 'none';
  if (cs) cs.style.display = 'none';
  Object.keys(lastReg).forEach(k => lastReg[k] = null);
  document.querySelectorAll('.role-btn').forEach(b =>
    b.classList.remove('sel-coord','sel-fila','sel-atencion')
  );
  document.getElementById('coord-form').style.display = 'none';
  document.getElementById('obs-form').style.display   = 'none';
  document.getElementById('inp-label').value = '';
  document.getElementById('btn-entrar').disabled = true;
  // reset coord mode toggle to "Nueva"
  const tN = document.getElementById('tab-nueva');
  const tR = document.getElementById('tab-retomar');
  const dN = document.getElementById('coord-nueva');
  const dR = document.getElementById('coord-retomar');
  if (tN) { tN.classList.add('active'); }
  if (tR) { tR.classList.remove('active'); }
  if (dN) { dN.style.display = 'flex'; }
  if (dR) { dR.style.display = 'none'; }
  showScreen('setup');
};

window.showTab = function(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-registrar').style.display = tab === 'registrar' ? 'flex'  : 'none';
  document.getElementById('tab-datos').style.display     = tab === 'datos'     ? 'block' : 'none';
  if (tab === 'datos') renderDatos();
};

// ══════════════════════════════════════════════════════════════
//  Render: Datos
// ══════════════════════════════════════════════════════════════
function renderDatos() {
  const content = document.getElementById('datos-content');
  if (!content) return;

  const tipos = rol === 'fila'
    ? [{ tipo:'llegada', label:'⬇ Llegadas', cls:'color-llegada' }]
    : [
        { tipo:'inicio', label:'▶ Inicio atención', cls:'color-inicio' },
        { tipo:'fin',    label:'■ Fin atención',    cls:'color-fin'    },
      ];

  content.innerHTML = tipos.map(({ tipo, label, cls }) => {
    const evs = sessionEvents.filter(e => e.tipo === tipo).sort((a,b) => a.t_server - b.t_server);
    const rows = evs.length
      ? [...evs].reverse().map((ev, ri) => {
          const i    = evs.length - 1 - ri;
          const prev = evs[i-1];
          const intv = prev ? ((ev.t_server - prev.t_server)/1000).toFixed(2) + 's' : '—';
          return `<div class="event-item">
            <span class="ei-n">${i+1}</span>
            <span class="ei-hora ${cls}">${ev.hora}</span>
            <span class="ei-intv">${intv}</span>
            <span class="ei-src ${ev._offline?'src-offline':'src-online'}">${ev._offline?'local':'sync'}</span>
          </div>`;
        }).join('')
      : '<div class="empty-list">Sin datos</div>';

    return `
      <div class="data-section">
        <div class="data-header">
          <span class="data-title ${cls}">${label}</span>
          <span class="data-count">${evs.length} reg</span>
        </div>
        <div class="event-list">${rows}</div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
//  Connectivity
// ══════════════════════════════════════════════════════════════
function onOnline()  { online = true;  updateConnBadge(); updateCoordConnBadge(); setSyncState(qCount() > 0 ? 'desynced' : 'synced'); syncManual(); }
function onOffline() { online = false; updateConnBadge(); updateCoordConnBadge(); setSyncState('offline'); }

function updateConnBadge() {
  const b = document.getElementById('badge-conn');
  if (!b) return;
  b.className   = online ? 'badge badge-online' : 'badge badge-offline';
  b.textContent = online ? '● Online' : '○ Offline';
  updateQueueBadge();
}
function updateCoordConnBadge() {
  const b = document.getElementById('coord-badge-conn');
  if (!b) return;
  b.className   = online ? 'badge badge-online' : 'badge badge-offline';
  b.textContent = online ? '● Online' : '○ Offline';
}
function updateQueueBadge() {
  const n = qCount();
  const b = document.getElementById('badge-queue');
  if (!b) return;
  b.style.display = n > 0 ? 'inline-block' : 'none';
  b.textContent   = `↑ ${n}`;
}

window.syncManual = async function() {
  setSyncState('saving');
  const b = document.getElementById('badge-conn');
  if (b) b.innerHTML = '<span class="spinner"></span>Sync…';
  const { flushed } = await syncNow();
  if (flushed > 0) await cargarSesion();
  updateConnBadge();
  setSyncState(qCount() > 0 ? 'desynced' : online ? 'synced' : 'offline');
};

// ══════════════════════════════════════════════════════════════
//  Sync state badge
// ══════════════════════════════════════════════════════════════
function setSyncState(state) {
  syncState = state;
  const map = {
    offline:  ['badge badge-offline',   '○ Sin conexión'],
    saving:   ['badge badge-saving',    '⏳ Guardando…'],
    synced:   ['badge badge-online',    '✓ Sincronizado'],
    desynced: ['badge badge-desynced',  '⚠ Desincronizado'],
  };
  const [cls, text] = map[state] || ['badge', '—'];
  ['badge-sync', 'coord-badge-sync'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.style.display !== 'none') { el.className = cls; el.textContent = text; }
  });
}

// ══════════════════════════════════════════════════════════════
//  Force refresh / sync for coordinator
// ══════════════════════════════════════════════════════════════
window.syncManualCoord = async function() {
  setSyncState('saving');
  await syncNow();
  updateCoordConnBadge();
  setSyncState(qCount() > 0 ? 'desynced' : online ? 'synced' : 'offline');
};

window.forceRefreshCoord = async function() {
  try {
    const s = await fetchOneSession(sessionId);
    if (s) {
      if (s.started_at != null) sessionStartedAt = Number(s.started_at);
      if (s.status !== sessionStatus) {
        sessionStatus = s.status;
        renderCoordBadge();
        renderCoordBody();
      }
    }
    const rawRefresh = (await fetchSession(sessionId)) || [];
    sessionEvents = rawRefresh.map(e => ({ ...e, t_server: Number(e.t_server) }));
    updateCoordStats();
  } catch {}
};

// ══════════════════════════════════════════════════════════════
//  Force refresh for observer
// ══════════════════════════════════════════════════════════════
window.forceRefresh = async function() {
  try {
    const s = await fetchOneSession(sessionId);
    if (s) {
      if (s.started_at != null) sessionStartedAt = Number(s.started_at);
      if (s.status !== sessionStatus) {
        sessionStatus = s.status;
        applySessionState(sessionStatus);
      }
    }
  } catch {}
  await cargarSesion();
};

// ══════════════════════════════════════════════════════════════
//  Event counter display
// ══════════════════════════════════════════════════════════════
function updateEventCounter() {
  const el = document.getElementById('event-counter');
  if (!el) return;
  const tipos = rol === 'fila' ? ['llegada'] : ['inicio', 'fin'];
  const labels = { llegada: 'Llegadas', inicio: 'Inicio', fin: 'Fin' };
  const parts = tipos.map(t => {
    const all     = sessionEvents.filter(e => e.tipo === t);
    const nOffline = all.filter(e => e._offline).length;
    const nSync   = all.length - nOffline;
    const synced  = nOffline === 0 ? ' ✓' : ` (${nSync} sync, ${nOffline} local)`;
    return `${labels[t]}: ${all.length}${synced}`;
  });
  el.textContent = parts.join(' · ');

  const undoBtn = document.getElementById('btn-undo');
  if (undoBtn) {
    const hasAny = tipos.some(t => sessionEvents.some(e => e.tipo === t));
    undoBtn.disabled = !hasAny;
  }
}

// ══════════════════════════════════════════════════════════════
//  Undo last event
// ══════════════════════════════════════════════════════════════
window.deshacerUltimo = async function() {
  const tipos = rol === 'fila' ? ['llegada'] : ['inicio', 'fin'];
  const candidates = sessionEvents
    .filter(e => tipos.includes(e.tipo))
    .sort((a, b) => b.t_server - a.t_server);
  if (!candidates.length) return;

  const last = candidates[0];
  const idx  = sessionEvents.indexOf(last);

  if (last._offline) {
    removeFromQueue(last.t_server, last.tipo);
  } else if (last.id) {
    try { await deleteEvento(last.id); } catch {}
  }

  sessionEvents.splice(idx, 1);

  // Reset lastReg for that tipo
  const remaining = sessionEvents
    .filter(e => e.tipo === last.tipo)
    .sort((a, b) => b.t_server - a.t_server);
  if (remaining.length) {
    const prev = remaining[0];
    lastReg[last.tipo] = { t_server: prev.t_server };
    setLastDisplay(last.tipo, prev.hora, '');
  } else {
    lastReg[last.tipo] = null;
    setLastDisplay(last.tipo, '—', '—');
  }

  renderDatos();
  updateEventCounter();
  updateQueueBadge();
  setSyncState(qCount() > 0 ? 'desynced' : online ? 'synced' : 'offline');
};

// ══════════════════════════════════════════════════════════════
//  Service Worker
// ══════════════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
