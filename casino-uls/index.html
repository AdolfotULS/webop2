<script type="module">
import {
  insertEvento, fetchSession, subscribeSession,
  syncNow, qCount, serverNow
} from './supabase.js';

// ══════════════════════════════════════════════════════════════
//  Estado de la app
// ══════════════════════════════════════════════════════════════
let rol, sessionId, sessionLabel, nCajas;
let sessionEvents = [];   // cache local de todos los eventos de la sesión
let jornada_start = null; // t_server del primer evento (referencia de tiempo)
let timerIv = null;
let unsubscribe = null;
let online = navigator.onLine;

// ── Setup de validación ───────────────────────────────────────
document.getElementById('sel-rol').addEventListener('change', validarSetup);
document.getElementById('sel-sesion').addEventListener('change', validarSetup);
function validarSetup() {
  document.getElementById('btn-entrar').disabled =
    !document.getElementById('sel-rol').value;
}

// ── Entrar ───────────────────────────────────────────────────
window.entrar = async function () {
  rol          = document.getElementById('sel-rol').value;
  const selSes = document.getElementById('sel-sesion');
  sessionId    = selSes.value;
  sessionLabel = selSes.options[selSes.selectedIndex].dataset.label;
  nCajas       = parseInt(document.getElementById('inp-cajas').value) || 3;

  // UI por rol
  const roles = {
    llegada: { icon:'⬇', label:'Llegó alguien', hint:'toca cada vez que llegue', color:'#60a5fa', text:'Persona 1 · Llegadas' },
    inicio:  { icon:'▶', label:'Inicia atención', hint:'toca cuando empieza a ser atendido', color:'#fbbf24', text:'Persona 2 · Inicio atención' },
    fin:     { icon:'✓', label:'Fin atención', hint:'toca cuando termina y pasa al siguiente', color:'#4ade80', text:'Persona 3 · Fin atención' },
  };
  const cfg = roles[rol];
  document.getElementById('reg-icon').textContent  = cfg.icon;
  document.getElementById('reg-label').textContent = cfg.label;
  document.getElementById('reg-hint').textContent  = cfg.hint;
  document.getElementById('last-val').style.color  = cfg.color;
  document.getElementById('lbl-rol').textContent   = cfg.text;
  document.getElementById('lbl-sesion').textContent = sessionLabel;

  document.getElementById('screen-setup').style.display = 'none';
  const main = document.getElementById('screen-main');
  main.style.display = 'flex';
  main.className = `role-${rol}`;

  // Cargar eventos existentes
  await cargarSesion();
  // Suscribir realtime
  unsubscribe = subscribeSession(sessionId, onRealtimeEvent);
  // Habilitar botón
  document.getElementById('btn-reg').disabled = false;
  // Arrancar cronómetro
  startTimer();
  // Monitor de conexión
  window.addEventListener('online',  onOnline);
  window.addEventListener('offline', onOffline);
  updateConnBadge();
};

// ── Volver a setup ────────────────────────────────────────────
window.volverSetup = function () {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  clearInterval(timerIv);
  window.removeEventListener('online', onOnline);
  window.removeEventListener('offline', onOffline);
  document.getElementById('screen-main').style.display = 'none';
  document.getElementById('screen-setup').style.display = 'flex';
  sessionEvents = [];
  jornada_start = null;
};

// ══════════════════════════════════════════════════════════════
//  Registrar evento
// ══════════════════════════════════════════════════════════════
window.registrarEvento = async function (e) {
  const btn = document.getElementById('btn-reg');
  btn.disabled = true;

  // Ripple
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.left = (e.offsetX - 40) + 'px';
  ripple.style.top  = (e.offsetY - 40) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);

  // Timestamp del servidor
  const t_server = await serverNow();
  const hora = new Date(t_server).toLocaleTimeString('es-CL', { hour12: false });

  const row = {
    session_id:    sessionId,
    session_label: sessionLabel,
    tipo:          rol,
    t_server,
    hora,
  };

  const { ok, offline } = await insertEvento(row);

  if (ok) {
    // Agregar al cache local si offline (realtime lo agrega si online)
    if (offline) {
      sessionEvents.push({ ...row, _offline: true });
      renderDatos();
    }
    // Mostrar último valor
    const prev = sessionEvents.filter(ev => ev.tipo === rol && !offline).at(-1);
    if (prev) {
      const diff = ((t_server - prev.t_server) / 1000).toFixed(1);
      document.getElementById('last-val').textContent  = diff + 's';
      document.getElementById('last-time').textContent = `desde el anterior · ${hora}`;
    } else {
      document.getElementById('last-val').textContent  = hora;
      document.getElementById('last-time').textContent = 'primer registro';
    }
    if (navigator.vibrate) navigator.vibrate(offline ? [30, 30, 30] : 25);
  }

  updateQueueBadge();
  setTimeout(() => { btn.disabled = false; }, 300); // anti-doble tap
};

// ── Realtime: nuevo evento de otro celular ────────────────────
function onRealtimeEvent(row) {
  // Evitar duplicados
  if (!sessionEvents.find(e => e.t_server === row.t_server && e.tipo === row.tipo)) {
    sessionEvents.push(row);
    renderDatos();
  }
}

// ══════════════════════════════════════════════════════════════
//  Cargar sesión desde Supabase
// ══════════════════════════════════════════════════════════════
async function cargarSesion() {
  try {
    const rows = await fetchSession(sessionId);
    sessionEvents = rows || [];
    if (sessionEvents.length) {
      jornada_start = sessionEvents[0].t_server;
    }
    renderDatos();
  } catch {
    // offline al cargar: arranca con cache vacío
  }
}

// ══════════════════════════════════════════════════════════════
//  Cronómetro
// ══════════════════════════════════════════════════════════════
function startTimer() {
  const display = document.getElementById('timer-display');
  const refTime = Date.now();
  clearInterval(timerIv);
  timerIv = setInterval(() => {
    const s = Math.floor((Date.now() - refTime) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    display.textContent = `${mm}:${ss}`;
    display.classList.toggle('running', s > 0);
  }, 500);
}

// ══════════════════════════════════════════════════════════════
//  Tabs
// ══════════════════════════════════════════════════════════════
window.showTab = function(tab, btn) {
  ['registrar','datos','resumen'].forEach(t => {
    document.getElementById('tab-' + t).style.display = 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = 'flex';
  btn.classList.add('active');
  if (tab === 'datos')    renderDatos();
  if (tab === 'resumen')  renderResumen();
};
// Mostrar tab inicial
document.getElementById('tab-registrar').style.display = 'flex';

// ══════════════════════════════════════════════════════════════
//  Render: Tab Datos
// ══════════════════════════════════════════════════════════════
function renderDatos() {
  ['llegada','inicio','fin'].forEach(tipo => {
    const evs = sessionEvents
      .filter(e => e.tipo === tipo)
      .sort((a,b) => a.t_server - b.t_server);

    document.getElementById('cnt-' + tipo).textContent = evs.length + ' reg';

    const list = document.getElementById('list-' + tipo);
    if (!evs.length) {
      list.innerHTML = '<div class="empty-list">Sin datos</div>';
      return;
    }
    list.innerHTML = [...evs].reverse().map((ev, ri) => {
      const i = evs.length - 1 - ri;
      const prev = evs[i - 1];
      const intv = prev
        ? ((ev.t_server - prev.t_server) / 1000).toFixed(2) + 's'
        : 'inicio';
      const srcClass = ev._offline ? 'src-offline' : 'src-online';
      const srcLabel = ev._offline ? 'local' : 'sync';
      return `<div class="event-item">
        <span class="ei-n">${i + 1}</span>
        <span class="ei-hora color-${tipo}">${ev.hora}</span>
        <span class="ei-intv">${intv}</span>
        <span class="ei-src ${srcClass}">${srcLabel}</span>
      </div>`;
    }).join('');
  });
}

// ══════════════════════════════════════════════════════════════
//  Render: Tab Resumen
// ══════════════════════════════════════════════════════════════
function avg(a) { return a.length ? a.reduce((x,y) => x+y, 0) / a.length : 0; }
function std(a) {
  if (a.length < 2) return 0;
  const m = avg(a);
  return Math.sqrt(a.map(x => (x-m)**2).reduce((x,y) => x+y, 0) / (a.length - 1));
}
function intervals(arr) {
  const r = [];
  for (let i = 1; i < arr.length; i++)
    r.push((arr[i].t_server - arr[i-1].t_server) / 1000);
  return r;
}

function renderResumen() {
  const el = document.getElementById('resumen-content');

  const llegadas = sessionEvents.filter(e => e.tipo === 'llegada').sort((a,b) => a.t_server - b.t_server);
  const inicios  = sessionEvents.filter(e => e.tipo === 'inicio' ).sort((a,b) => a.t_server - b.t_server);
  const fines    = sessionEvents.filter(e => e.tipo === 'fin'    ).sort((a,b) => a.t_server - b.t_server);

  const intLlegadas  = intervals(llegadas);
  const intAtenciones = inicios.map((ini, i) => fines[i]
    ? (fines[i].t_server - ini.t_server) / 1000
    : null).filter(v => v !== null && v > 0);

  if (!intLlegadas.length && !intAtenciones.length) {
    el.innerHTML = '<div class="empty-list" style="padding:40px">Sin datos suficientes aún.</div>';
    return;
  }

  const c = nCajas;
  const lambda = intLlegadas.length  ? 1 / avg(intLlegadas)   : null;
  const mu     = intAtenciones.length ? 1 / avg(intAtenciones) : null;
  const rho    = (lambda && mu) ? lambda / (c * mu) : null;

  const rhoClass = rho === null ? '' : rho >= 1 ? 'bad' : rho >= 0.8 ? 'warn' : 'good';
  const rhoText  = rho === null ? '' : rho >= 1
    ? `ρ = ${rho.toFixed(3)} ≥ 1 → cola infinita. El sistema colapsa con ${c} caja${c>1?'s':''}.`
    : rho >= 0.8
    ? `ρ = ${rho.toFixed(3)} → carga alta. Probables colas en peak con ${c} caja${c>1?'s':''}.`
    : `ρ = ${rho.toFixed(3)} → sistema estable con ${c} caja${c>1?'s':''}.`;

  el.innerHTML = `
    <div class="sec-label">Llegadas — ${sessionLabel}</div>
    <div class="sgrid">
      <div class="sbox"><div class="sl">n registros</div><div class="sv">${llegadas.length}</div></div>
      <div class="sbox"><div class="sl">Prom. entre llegadas</div><div class="sv">${intLlegadas.length ? avg(intLlegadas).toFixed(2) : '—'}<span class="su"> s</span></div></div>
      <div class="sbox"><div class="sl">σ llegadas</div><div class="sv">${intLlegadas.length ? std(intLlegadas).toFixed(2) : '—'}</div></div>
      <div class="sbox"><div class="sl">λ (person/s)</div><div class="sv" style="font-size:16px">${lambda ? lambda.toFixed(5) : '—'}</div></div>
    </div>

    <div class="sec-label">Atención (inicio→fin)</div>
    <div class="sgrid">
      <div class="sbox"><div class="sl">n pares medidos</div><div class="sv">${intAtenciones.length}</div></div>
      <div class="sbox"><div class="sl">Prom. atención</div><div class="sv">${intAtenciones.length ? avg(intAtenciones).toFixed(2) : '—'}<span class="su"> s</span></div></div>
      <div class="sbox"><div class="sl">σ atención</div><div class="sv">${intAtenciones.length ? std(intAtenciones).toFixed(2) : '—'}</div></div>
      <div class="sbox"><div class="sl">μ (person/s)</div><div class="sv" style="font-size:16px">${mu ? mu.toFixed(5) : '—'}</div></div>
    </div>

    ${rho !== null ? `
    <div class="sec-label">Factor de utilización · M/M/${c}</div>
    <div class="rho-box ${rhoClass}">
      <div class="rl">${rho>=1?'⚠ Sistema inestable':rho>=0.8?'⚡ Carga alta':'✓ Sistema estable'}</div>
      <p>${rhoText}</p>
    </div>` : ''}

    <button class="export-btn" onclick="exportCSV()">⬇ Exportar CSV para Minitab</button>
  `;
}

// ══════════════════════════════════════════════════════════════
//  Export CSV
// ══════════════════════════════════════════════════════════════
window.exportCSV = function () {
  const llegadas  = sessionEvents.filter(e=>e.tipo==='llegada').sort((a,b)=>a.t_server-b.t_server);
  const inicios   = sessionEvents.filter(e=>e.tipo==='inicio' ).sort((a,b)=>a.t_server-b.t_server);
  const fines     = sessionEvents.filter(e=>e.tipo==='fin'    ).sort((a,b)=>a.t_server-b.t_server);
  const intLL     = intervals(llegadas);
  const intAT     = inicios.map((ini,i)=>fines[i]?((fines[i].t_server-ini.t_server)/1000):null).filter(v=>v!==null&&v>0);

  let csv = `# Casino ULS — ${sessionLabel}\r\n`;
  csv    += `# Exportado: ${new Date().toLocaleString('es-CL')}\r\n`;
  csv    += `# Cajas: ${nCajas}\r\n\r\n`;

  csv += `tipo,n,hora,t_server_ms\r\n`;
  [...llegadas,...inicios,...fines]
    .sort((a,b)=>a.t_server-b.t_server)
    .forEach((e,i)=>{ csv += `${e.tipo},${i+1},${e.hora},${e.t_server}\r\n`; });

  if (intLL.length) {
    csv += `\r\n# MINITAB — intervalos entre llegadas\r\nEntre_llegadas_s\r\n`;
    csv += intLL.map(v=>v.toFixed(2)).join('\r\n') + '\r\n';
  }
  if (intAT.length) {
    csv += `\r\n# MINITAB — tiempos de atención\r\nTiempo_atencion_s\r\n`;
    csv += intAT.map(v=>v.toFixed(2)).join('\r\n') + '\r\n';
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `casino_uls_${sessionId}.csv`; a.click();
  URL.revokeObjectURL(url);
};

function onOnline()  { online = true;  updateConnBadge(); syncManual(); }
function onOffline() { online = false; updateConnBadge(); }

function updateConnBadge() {
  const b = document.getElementById('badge-conn');
  b.className = online ? 'badge badge-online' : 'badge badge-offline';
  b.textContent = online ? '● Online' : '○ Offline';
  updateQueueBadge();
}

function updateQueueBadge() {
  const n = qCount();
  const b = document.getElementById('badge-queue');
  b.style.display = n > 0 ? 'inline-block' : 'none';
  b.textContent   = `↑ ${n}`;
}

window.syncManual = async function () {
  const b = document.getElementById('badge-conn');
  b.innerHTML = '<span class="spinner"></span>Sync…';
  const { flushed, remaining } = await syncNow();
  if (flushed > 0) await cargarSesion();
  updateConnBadge();
};
